<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — MiniSocial</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="auth-page">
    <div class="card auth-card">
      <a class="auth-back" href="../index.html">&larr; Back home</a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue to MiniSocial</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">Username or email</label>
          <input class="form-input" type="text" id="identifier" name="identifier" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required />
            <button type="button" class="btn-icon password-toggle" id="toggle-password">Show</button>
          </div>
        </div>

        <div class="form-error" id="login-error" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="./pages/register.html">Sign up</a></p>
    </div>
  </main>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
