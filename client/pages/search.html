<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — MiniSocial</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages/search.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="search-page">
    <div class="container">
      <div class="search-input-wrap">
        <input type="search" id="search-input" placeholder="Search by name or username..." aria-label="Search users" />
      </div>

      <div class="feed-loader" id="search-loader" hidden>Searching...</div>

      <div id="search-results"></div>

      <div class="empty-state" id="search-empty" hidden>
        <div class="empty-state-icon">&#128269;</div>
        <h3>No users found</h3>
        <p>Try a different name or username.</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/search.js"></script>
</body>
</html>
