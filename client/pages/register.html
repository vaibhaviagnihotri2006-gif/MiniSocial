<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — MiniSocial</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="auth-page">
    <div class="card auth-card">
      <a class="auth-back" href="../index.html">&larr; Back home</a>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Join MiniSocial in seconds</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="fullName">Full name</label>
          <input class="form-input" type="text" id="fullName" name="fullName" autocomplete="name" required maxlength="100" />
          <div class="form-error" id="fullName-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" autocomplete="username" required maxlength="20" placeholder="lowercase_letters_numbers" />
          <div class="form-error" id="username-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required />
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
            <button type="button" class="btn-icon password-toggle" id="toggle-password">Show</button>
          </div>
          <div class="form-hint">At least 8 characters</div>
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-error" id="register-error" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="./pages/login.html">Log in</a></p>
    </div>
  </main>

  <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
