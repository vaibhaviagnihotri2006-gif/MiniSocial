<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile — MiniSocial</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages/editProfile.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="edit-profile-page">
    <div class="container">
      <h1>Edit Profile</h1>

      <form id="edit-profile-form" class="card" novalidate>
        <div class="form-group">
          <label class="form-label">Profile photo</label>
          <div class="image-upload-row">
            <img id="edit-profile-preview" class="image-upload-preview" src="/images/placeholders/default-avatar.png" alt="Profile preview" />
            <label class="image-upload-label">
              Change photo
              <input type="file" id="edit-profileImage" accept="image/jpeg,image/png,image/webp" />
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Cover photo</label>
          <div class="image-upload-row">
            <img id="edit-cover-preview" class="image-upload-preview cover" src="/images/placeholders/default-avatar.png" alt="Cover preview" />
            <label class="image-upload-label">
              Change cover
              <input type="file" id="edit-coverImage" accept="image/jpeg,image/png,image/webp" />
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-fullName">Full name</label>
          <input class="form-input" type="text" id="edit-fullName" maxlength="100" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-bio">Bio</label>
          <textarea class="form-textarea" id="edit-bio" maxlength="160" placeholder="Tell people about yourself"></textarea>
          <span class="char-counter" id="edit-bio-counter">0 / 160</span>
        </div>

        <div class="form-error" id="edit-profile-error" role="alert"></div>

        <div class="flex gap-1">
          <button type="submit" class="btn btn-primary" id="edit-profile-submit">Save Changes</button>
          <a class="btn btn-secondary" href="/pages/profile.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/js/pages/editProfile.js"></script>
</body>
</html>
